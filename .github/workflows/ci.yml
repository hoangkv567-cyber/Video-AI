name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: videoai
          POSTGRES_PASSWORD: ci-strong-database-password
          POSTGRES_DB: videoai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: pip install uv==0.12.5
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Lint
        run: uv run ruff check app tests alembic
      - name: Type check
        run: uv run mypy app
      - name: Test
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./test.sqlite3
          TEST_POSTGRES_URL: postgresql+psycopg://videoai:ci-strong-database-password@localhost:5432/videoai
        run: uv run pytest -q
      - name: Migration smoke test
        env:
          APP_ENV: production
          SECRET_KEY: ci-secret-key-that-is-longer-than-thirty-two-bytes
          TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DATABASE_URL: postgresql+psycopg://videoai:ci-strong-database-password@localhost:5432/videoai
          REDIS_URL: redis://:ci-strong-redis-password@localhost:6379/0
          MINIO_ACCESS_KEY: ci-minio-access
          MINIO_SECRET_KEY: ci-strong-minio-secret
          PUBLIC_BASE_URL: https://video-ci.example.com
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Validate Compose
        run: |
          cp .env.example .env
          cp .env.production.example .env.production
          docker compose config --quiet
          docker compose --env-file .env.production.example \
            -f compose.yaml -f compose.production.yaml config --quiet
      - name: Build application image
        run: docker compose build web
      - name: Boot infrastructure and application smoke
        run: |
          docker compose up --detach postgres redis minio migrate web caddy
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color web migrate caddy
          exit 1
      - name: Tear down Compose
        if: always()
        run: docker compose down --volumes
