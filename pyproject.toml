[project]
name = "video-ai"
version = "0.1.0"
description = "Internal MVP: automated AI short-video generation and multi-platform publishing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "minio>=7.2",
    "cryptography>=43.0",
    "itsdangerous>=2.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
google = [
    "google-genai>=1.0",
    "google-cloud-texttospeech>=2.17",
]
free = [
    "edge-tts>=6.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "runtime: invokes locally installed runtime binaries such as FFmpeg",
    "postgres: requires TEST_POSTGRES_URL and a live PostgreSQL server",
]
