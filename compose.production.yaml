x-production-app-environment: &production-app-environment
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with a URL-encoded password}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL with a URL-encoded password}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-production-security: &production-security
  - no-new-privileges:true

services:
  web:
    environment: *production-app-environment
    logging: *production-logging
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt: *production-security
  migrate:
    environment: *production-app-environment
    logging: *production-logging
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt: *production-security
  worker-ai:
    environment: *production-app-environment
    logging: *production-logging
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 384
    security_opt: *production-security
  worker-render:
    environment: *production-app-environment
    logging: *production-logging
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    security_opt: *production-security
  worker-publish:
    environment: *production-app-environment
    logging: *production-logging
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt: *production-security
  scheduler:
    environment: *production-app-environment
    logging: *production-logging
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt: *production-security
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    logging: *production-logging
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
  redis:
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    logging: *production-logging
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    logging: *production-logging
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
  caddy:
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:?set CADDY_ADDRESS to the public domain}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    logging: *production-logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
